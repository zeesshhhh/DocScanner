name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: unzip -o DocScanner-source.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp src/app/build/outputs/apk/release/app-release.apk DocScanner-v1.0.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: DocScanner v1.0.${{ github.run_number }}
          files: DocScanner-*.apk
